name: Release

# Triggered by pushing a tag like v0.2.1. The tag value should match the
# version in apps/desktop/package.json — electron-builder reads from there.
#
# Manual trigger via workflow_dispatch is also supported for testing the
# pipeline; it publishes to the release for the current package.json version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases

jobs:
  # Create the GitHub Release ONCE, up front. Without this, the three parallel
  # build jobs each run electron-builder with `releaseType: release`, so they
  # all POST /releases at nearly the same moment — one wins and the others fail
  # with HTTP 422 "already_exists", killing that platform's build. Pre-creating
  # the release means every build just uploads assets into an existing release.
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create the release if it doesn't exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./apps/desktop/package.json').version")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to create."
          else
            # --target is only used if the tag ref doesn't exist yet; on a tag
            # push the tag already exists and gh attaches the release to it.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "${TAG#v}" --notes "Build in progress…"
          fi

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac:publish
          - os: windows-latest
            script: build:win:publish
          - os: ubuntu-latest
            script: build:linux:publish

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # setup-node@v5 enables package-manager caching by default, which runs
          # the global Yarn 1.x before Corepack is activated and chokes on the
          # project's "packageManager": "yarn@4.5.0". We cache Yarn ourselves
          # below, so turn it off.
          package-manager-cache: false

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Cache Yarn
        uses: actions/cache@v5
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build & publish
        env:
          # electron-builder uploads assets to the pre-created Release.
          # Provided automatically by Actions.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip mac code signing / notarization — open-source MVP runs
          # unsigned. Users get a Gatekeeper warning on first launch.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: yarn workspace @multizen/desktop ${{ matrix.script }}

  # The release starts with a placeholder body. Once the builds finish, generate
  # a grouped changelog from Conventional Commits since the previous tag and set
  # it as the release notes. Runs on tag pushes even if a build failed (so the
  # notes + succeeded platforms still land), just not when the run is cancelled.
  release-notes:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags so we can diff against the previous tag

      - name: Generate & set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(bash scripts/release-notes.sh "${GITHUB_REF_NAME}")"
          if [ -z "$notes" ]; then
            echo "No conventional commits found for ${GITHUB_REF_NAME}; leaving notes as-is."
            exit 0
          fi
          printf '%s\n' "$notes"
          gh release edit "${GITHUB_REF_NAME}" --notes "$notes"
